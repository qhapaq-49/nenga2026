/* ===== エンジン ===== */
let stateIdx = 0;
let lineIdx = 0;

const bg = document.getElementById("bg");
const ch = document.getElementById("ch");
const text = document.getElementById("text");
const choices = document.getElementById("choices");

function render(){
  const s = STATES[stateIdx];
  bg.src = s.screen.bg;
  ch.src = s.screen.ch ?? IMG.none;

  text.innerHTML = s.lines[lineIdx] ?? "";
  choices.innerHTML = "";

  if (lineIdx >= s.lines.length - 1) {
    for (const [label, next] of s.choices) {
      const btn = document.createElement("button");
      btn.textContent = label;
      btn.onclick = () => { stateIdx = next; lineIdx = 0; render(); };
      choices.appendChild(btn);
    }
  }
}

text.onclick = () => {
  const s = STATES[stateIdx];
  if (lineIdx < s.lines.length - 1) { lineIdx++; render(); }
};

text.oncontextmenu = (e) => {
  e.preventDefault();
  const s = STATES[stateIdx];
  lineIdx = s.lines.length - 1;
  render();
};

render();
</script>
