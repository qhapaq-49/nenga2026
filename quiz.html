<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2025 時事クイズ・タイムショック</title>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  color:#fff;
}
#bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
    url("bg.png") center / cover no-repeat;
  z-index:-1;
}
.hidden{ display:none; }

#screen{
  height:100%;
  display:flex;
  flex-direction:column;
}

#title{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:24px;
}
#title h1{
  font-size:28px;
  line-height:1.3;
}
#title p{
  font-size:14px;
  opacity:.9;
  margin:16px 0 24px;
  white-space:pre-line;
}
.start{
  padding:16px 32px;
  background:#fff;
  color:#000;
  border-radius:999px;
  font-weight:800;
  font-size:16px;
}

#game{
  flex:1;
  padding:20px;
}
.timer{
  text-align:center;
  font-size:32px;
  font-weight:900;
  margin-bottom:12px;
}
.question{
  font-size:18px;
  line-height:1.6;
  margin-bottom:16px;
}
.choice{
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
}
.choice.selected{
  background:rgba(255,255,255,.35);
}

#result{
  padding:20px;
  text-align:center;
}
.score{
  font-size:32px;
  font-weight:900;
}
.message{
  margin-top:12px;
  font-size:18px;
  font-weight:700;
}
.btn{
  margin-top:16px;
  padding:14px;
  background:#fff;
  color:#000;
  border-radius:14px;
  font-weight:800;
}
.explain{
  margin-top:20px;
  font-size:14px;
  line-height:1.6;
  text-align:left;
}
</style>
</head>

<body>
<div id="bg"></div>

<div id="screen">

<!-- タイトル画面 -->
<div id="title">
  <h1>2025 時事クイズ<br>タイムショック</h1>
  <p>
このクイズとシステムは
問題定義から実装まで
人間は一切コードを書かず
生成AIのみで制作されています
  </p>
  <div class="start" id="startBtn">タップしてスタート</div>
</div>

<!-- ゲーム画面 -->
<div id="game" class="hidden">
  <div class="timer" id="countdown">5</div>
  <div class="question" id="question"></div>
  <div id="choices"></div>
</div>

<!-- 結果画面 -->
<div id="result" class="hidden">
  <div class="score" id="score"></div>
  <div class="message" id="message"></div>
  <div class="btn" onclick="showExplanations()">解答と解説を見る</div>
  <div class="btn" onclick="location.reload()">もう一度</div>
  <div class="explain hidden" id="explanations"></div>
</div>

</div>

<script src="questions.js"></script>
<script>
let index = 0;
let score = 0;
let started = false;

let countdown = 5;
let intervalId;

const answers = [];
let selectedAnswer = null;

const qEl = document.getElementById("question");
const cEl = document.getElementById("choices");
const cdEl = document.getElementById("countdown");

document.getElementById("startBtn").onclick = () => {
  if (started) return;
  started = true;
  document.getElementById("title").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  showQuestion();
};

function showQuestion(){
  if (index >= QUESTIONS.length) {
    end();
    return;
  }

  selectedAnswer = null;
  countdown = 5;
  cdEl.textContent = countdown;

  const q = QUESTIONS[index];
  qEl.textContent = `Q${index+1}. ${q.question}`;
  cEl.innerHTML = "";

  q.choices.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "choice";
    d.textContent = t;
    d.onclick = () => {
      selectedAnswer = i;
      document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));
      d.classList.add("selected");
    };
    cEl.appendChild(d);
  });

  clearInterval(intervalId);
  intervalId = setInterval(()=>{
    countdown--;
    cdEl.textContent = countdown;
    if (countdown <= 0) {
      recordAnswer();
      index++;
      showQuestion();
    }
  },1000);
}

function recordAnswer(){
  const q = QUESTIONS[index];
  const correct = (selectedAnswer === q.answer);
  if (correct) score++;
  answers.push({ q, correct });
}

function end(){
  clearInterval(intervalId);
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("score").textContent =
    `${score} / ${QUESTIONS.length} 問正解`;

  let msg = "Happy New Year 2026 - 今年もよろしく！";
  if (score === QUESTIONS.length) {
    msg += "\n全問正解。偉い！";
  }
  document.getElementById("message").textContent = msg;
}

function showExplanations(){
  const e = document.getElementById("explanations");
  e.classList.remove("hidden");
  e.innerHTML="";
  answers.forEach((a,i)=>{
    e.innerHTML += `
      <h3>Q${i+1} ${a.correct?"⭕":"❌"}</h3>
      <div><b>正解：</b>${a.q.choices[a.q.answer]}</div>
      <div>${a.q.explanation}</div>
    `;
  });
}
</script>
</body>
</html>
